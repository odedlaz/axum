[workspace]
members = ["axum", "axum-*", "examples/*"]
# Only check / build main crates by default (check all with `--workspace`)
default-members = ["axum", "axum-*"]
exclude = [
    # Example has been deleted, but README.md remains
    "examples/async-graphql",
    # Dependency bug, fixed on main - DO NOT MERGE
    "examples/diesel-async-postgres"
]
resolver = "2"

[workspace.package]
rust-version = "1.80"

[workspace.lints.rust]
unsafe_code = "forbid"

rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
type_complexity = "allow"

await_holding_lock = "warn"
dbg_macro = "warn"
empty_enums = "warn"
enum_glob_use = "warn"
exit = "warn"
filter_map_next = "warn"
fn_params_excessive_bools = "warn"
if_let_mutex = "warn"
imprecise_flops = "warn"
inefficient_to_string = "warn"
linkedlist = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
match_wildcard_for_single_variants = "warn"
mem_forget = "warn"
must_use_candidate = "warn"
needless_borrow = "warn"
needless_continue = "warn"
option_option = "warn"
rest_pat_in_fully_bound_structs = "warn"
return_self_not_must_use = "warn"
str_to_string = "warn"
suboptimal_flops = "warn"
todo = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"
verbose_file_reads = "warn"

# configuration for https://github.com/crate-ci/typos
[workspace.metadata.typos.default.extend-identifiers]
# These have been fixed in the past, but are still present in the changelog.
DefaultOnFailedUpdgrade = "DefaultOnFailedUpdgrade"
OnFailedUpdgrade = "OnFailedUpdgrade"

# permessage-deflate (RFC 7692) is unimplemented in tungstenite -- upstream issue
# snapview/tungstenite-rs#2, open since 2017. This fork carries it so the
# `ws` feature can negotiate the extension. Drop once it lands upstream.
[patch.crates-io]
# Pinned by rev, never by branch: a moving ref changes the build underneath us
# with no diff to show it, and the neighbouring `aws-creds` entry in buzz already
# pins a rev for exactly that reason.
tungstenite = { git = "https://github.com/odedlaz/tungstenite-rs", rev = "c9c84f0725a55f47d9811bcc776e9efe7f21110a" }
